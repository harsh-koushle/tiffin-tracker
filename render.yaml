databases:
  - name: tiffin-db
    plan: free

services:
  - type: web
    name: tiffin-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tiffin-db
          property: connectionString

  - type: web
    name: tiffin-frontend
    runtime: static
    rootDir: frontend
    buildCommand: ""
    staticPublishPath: .
